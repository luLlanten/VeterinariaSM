</head>
<body>
    <header>
        <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="principal_admin.html">Inicio Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="../Pag_principal/principal.html">Volver a Homepage</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="../Us_admin/modificaciones.html">Modificar</a>

                <a class="nav-link" href="../Catalogo/catalogo.html">Ver catalogo</a>
                </li>
            </ul>
            </div>
        </div>
        </nav>
    </header>
    <div>
        <h2>Agregar nuevo producto</h2>
        <hr>
        <section style="margin-left: 35%;margin-right: 35%;background-color: rgb(211, 207, 207);border-radius: 5%;padding: 30px;">
            <h4 style="text-align: center;margin-bottom: 10px;">Inserte los datos del producto</h4>
            <hr>
            <div style="display: flex;margin-left: 10px;margin-bottom: 10px;gap:10px;">
            <label>Id:</label>
            <input type="text">
            </div>
            <div style="display: flex;margin-left: 10px;margin-bottom: 10px;gap:10px;"> 
                <label>Nombre:</label>
                <input type="text">
            </div>
            <div style="display: flex;margin-left: 10px;margin-bottom: 10px;gap:10px;">
                <label> Categoria:</label>
                <input type="text">
            </div>
            <div style="display: flex;margin-left: 10px;margin-bottom: 10px;gap:10px;">
                <label>Tipo:</label>
                <input type="text">
            </div>
            <div style="display: flex;margin-left: 10px;margin-bottom: 10px;gap:10px;">
                <label>Precio:</label>
                <input type="text">
            </div>
            <div style="display: flex;margin-left: 10px;margin-bottom: 10px;gap:10px;">
                <label>Imagen (URL):</label>
                <input type="text">
            </div>
            <div style="display: flex;margin-left: 10px;margin-bottom: 10px;gap:10px;">
                <label>Detalles:</label>
                <textarea rows="3" cols="80" placeholder="Escribe una descripcion breve..."></textarea>
            </div>
            <div style="margin-left: 30%;">
            <a href="../Us_admin/modificaciones.html"><button>Volver</button></a>
            <button onclick="alert('Producto guardado sin exito')">Guardar</button>
            </div>
        </div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
