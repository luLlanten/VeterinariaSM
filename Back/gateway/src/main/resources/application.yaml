spring:
  application:
    name: gateway
  cloud:
      gateway:
        discovery:
            locator:
                enabled: true
                lower-case-service-id: true
            routes: 
              - id: cliente-lobby
                uri: lb://cliente-lobby
                predicates:
                  - path=/lobby/**
                id: citas
                uri: lb://citas
                predicates:
                  - path=/citas/**
                id: catalogo
                uri: lb://catalogo
                predicates:
                  - path=/catalogo/**
                id: admin
                uri: lb://admin
                predicates:
                  - path=/administracion/**
                id: compra
                uri: lb://compra
                predicates:
                  - path=/compra/**
                id: ficha
                uri: lb://ficha
                predicates:
                  - path=/ficha/**
eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

server:
    port: 8080