spring:
  application:
    name: compra
  datasource:
    url: jdbc:mysql://localhost:3306/db_vsm_compra
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    
  flyway:
    enabled: true
    locations:
    - classpath:db/migration
server:
  port: 8082
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
